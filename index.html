<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the phone screen instead of showing a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Climb Tracker</title>
  <!-- It references the CSS file and applies the styles to the page -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Climb Tracker</h1>
    <p id="today"></p>
  </header>

  <main>
    <section class="card">
      <h2>Today's session</h2>
      <form id="log-form">
        <!-- It calls the select element -->
        <label for="grade">Grade</label>
        <select id="grade" name="grade">
          <option value="4">4</option>
          <option value="5+">5+</option>
          <option value="6a">6a</option>
          <option value="6b">6b</option>
          <option value="6c">6c</option>
          <option value="7a">7a</option>
          <option value="7b">7b</option>
          <option value="7c">7c</option>

        </select>

        <label for="colour">Colour</label>
        <select id="colour" name="colour">
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option> 
          <option value="black">Black</option>
          <option value="yellow">Yellow</option>
          <option value="orange">Orange</option>
          <option value="purple">Purple</option>
          <option value="pink">Pink</option>
          <option value="cyan">Cyan</option>
        </select>

        <label for="attempts">Attempts</label>
        <input type="number" id="attempts" name="attempts" min="1" value="1">

        <label>
          <input type="checkbox" name="sent">
          Sent
        </label>

        <label>
          <input type="checkbox" name="beta">
          Intended beta
        </label>

        <fieldset>
          <legend>Effort</legend>
           <label>
              <input type="radio" name="effort" value="1">
              1
            </label>
            <label>
              <input type="radio"   name="effort" value="2">
              2
           </label>
          <label>
              <input type="radio"  name="effort" value="3">
              3
          </label>
          <label>
              <input type="radio"    name="effort" value="4">
              4
          </label>
          <label>
              <input type="radio"  name="effort" value="5">
              5
          </label>
        </fieldset>
        <button type="submit">Log</button>
      </form>
    </section>


    <section class="card">
      <h2>Today's list</h2>
      <ul id="today-list">
        
      </ul>
    </section>
  </main>

  <!-- Loaded at the end so the HTML elements above already exist when the script runs -->
  <!-- It references the script file and loads it when the page is loaded, if there is a typo in the file name, the script will not load and may cause errors -->
  <script src="app.js"></script>
</body>
</html>
